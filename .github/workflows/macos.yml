# macOS build: universal (x86_64 + arm64) CLAP + VST3, signed ad hoc.
# Runs on pushes to macos* branches, v* tags, or by hand
# (gh workflow run macos.yml); artifacts: maquina-macos (zip) and
# maquina-macos-dmg (the disk image with all plugins, one per instrument + its FX,
# SHA256SUMS.txt). A v* tag also publishes them as a GitHub release.
name: macOS

on:
  push:
    branches: ["macos*"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      plugins:
        description: "plugin folders (empty = the Makefile's MACOS_PLUGINS)"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write   # the release on v* tags
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build (x86_64 + arm64, lipo, ad-hoc sign)
        run: |
          if [ -n "${{ github.event.inputs.plugins }}" ]; then
            make -j"$(sysctl -n hw.ncpu)" macos MACOS_PLUGINS="${{ github.event.inputs.plugins }}"
          else
            make -j"$(sysctl -n hw.ncpu)" macos
          fi

      - name: Test (both archs; x86_64 under Rosetta)
        run: make macos-test

      - name: Package
        run: make macos-dist

      - name: Disk image (+ test install)
        run: make macos-dmg

      - name: One disk image per instrument (+ test installs)
        run: make macos-dmg-each

      - name: Checksums
        run: cd dist && shasum -a 256 *.dmg *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: maquina-macos
          path: dist/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: maquina-macos-dmg
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt

      - name: Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip dist/SHA256SUMS.txt \
            --title "Maquina $GITHUB_REF_NAME" \
            --notes-file tools/macos/release-notes.md --generate-notes
